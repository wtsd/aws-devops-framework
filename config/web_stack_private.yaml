# Private/NAT scenario config
scenario: private
stack_name: MyWebStackPrivate
region: us-east-1
project_name: demo-web-priv

vpc_cidr: 10.81.0.0/16
public_subnet_cidrs:
  - 10.81.10.0/24
  - 10.81.20.0/24
private_subnet_cidrs:
  - 10.81.110.0/24
  - 10.81.120.0/24

container_image: public.ecr.aws/nginx/nginx:latest
container_port: 80
desired_count: 1

# RDS
db_engine_version: "15.6"
db_instance_class: db.t4g.micro
db_allocated_storage: 20
db_name: appdb
db_username: appuser
# db_password via env: DB_PASSWORD

# DNS/ACM (optional)
# Option 1: Use existing cert
# provide_certificate_arn: "arn:aws:acm:REGION:ACCOUNT:certificate/..."

# Option 2: Create & validate cert + ALIAS in Route53
# domain_name: "app.example.com"
# hosted_zone_id: "Z123456ABCDEFG"

tags:
  Owner: Vlad
  Project: DevOpsFramework
